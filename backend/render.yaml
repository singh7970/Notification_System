services:
  - type: web
    name: notification-admin-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: POSTMARKAPP_TOKEN
        sync: false
      - key: POSTMARK_FROM_EMAIL
        sync: false
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false
